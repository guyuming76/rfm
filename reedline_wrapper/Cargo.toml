[package]
name = "reedline_wrapper"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]  # 编译为C兼容的动态库

[dependencies]
reedline = { git = "https://gitee.com/guyuming76/reedline.git", branch = "guyuming20260112", features = ["bashisms","external_printer"] }   #使用最新版本，bash兼容扩展
libc = "0.2"            # 提供C类型支持
nu-ansi-term = "0.50.0"
dirs = "3.0"
log = "0.4"          # 日志接口标准
env_logger = "0.11"   # 日志实现
pathdiff = "0.2"
#glib = { version = "0.10.3", features = ["v2_60", "c_glib"] } 
glib-sys = "0.15"
