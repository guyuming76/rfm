[package]
name = "reedline_wrapper"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]  # 编译为C兼容的动态库

[dependencies]
reedline = { version = "0.40.0", features = ["bashisms"] }    # 使用最新版本，bash兼任扩展
libc = "0.2"            # 提供C类型支持
nu-ansi-term = "0.50.0"
dirs = "3.0"
log = "0.4"          # 日志接口标准
env_logger = "0.11"   # 日志实现
# 使用nushell filecompletion
nu-cli = "0.104.1"
nu-protocol = "0.104.1"
nu-engine = "0.104.1"
nu-parser = "0.104.1"
